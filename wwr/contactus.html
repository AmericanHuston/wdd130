<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dusted Oar</title>
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        form {
            /* Just to center the form on the page */
            margin: 0 auto;
            width: 400px;

            /* To see the limits of the form */
            padding: 1em;
            border: 1px solid #cccccc;
            border-radius: 1em;
        }

        div + div {
            margin-top: 1em;
        }

        label {
            /* To make sure that all label have the same size and are properly align */
            display: inline-block;
            width: 90px;
            text-align: right;
        }

        input,
        textarea {
            /* To make sure that all text field have the same font settings
                By default, textarea are set with a monospace font */
            font: 1em sans-serif;

            /* To give the same size to all text field */
            width: 300px;

            -moz-box-sizing: border-box;
            box-sizing: border-box;

            /* To harmonize the look & feel of text field border */
            border: 1px solid #999999;
        }

        input:focus,
        textarea:focus {
            /* To give a little highlight on active elements */
            border-color: black;
        }

        textarea {
            /* To properly align multiline text field with their label */
            vertical-align: top;

            /* To give enough room to type some text */
            height: 5em;

            /* To allow users to resize any textarea vertically
                It works only on Chrome, Firefox and Safari */
            resize: vertical;
        }

        .button {
            /* To position the buttons to the same position of the text fields */
            padding-left: 90px; /* same size as the label elements */
        }

        button {
            /* This extra margin represent the same space as the space between
                the labels and their text fields */
            margin-left: 0.5em;
        }
        #feedback {
            background-color: antiquewhite;
            padding: .5em;
        }
        .moveDown {
            margin-top: 3em;
        }
    </style>
</head>

<body>
    <div id="content">
        <header>
            <a id="logo-link" href="index.html">
                <img id="logo" src="images/dusty.png" alt="Dusted Oar Logo">
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="rivers.html">Rivers</a>
                <a href="site-plan-rafting.html">Site Plan</a>
                <a href="contactus.html">Contact Us</a>
            </nav>
        </header>
            <main>
                <div id="feedback">
                    <form action="/my-handling-form-page" method="post">
                        <div>
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="user_name" />
                        </div>

                        <div>
                            <label for="mail">Email:</label>
                            <input type="email" id="mail" name="user_email" />
                        </div>

                        <div>
                            <label for="msg">Message:</label>
                            <textarea id="msg" name="user_message"></textarea>
                        </div>

                        <div class="button">
                            <button type="submit">Send your message</button>
                        </div>
                    </form>
                </div>
            </main>
        <footer>
            <p>Dusted Oar &copy; 2026 - Noah Sederstrom</p>
            <p><a href="site-plan-rafting.html">Site Plan</a></p>
            <p><a href="contactus.html">Contact Us</a></p>
            <div class="social">
                <a href="https://facebook.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/facebook.png" alt="fb icon">
                </a>
                <a href="https://twitter.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/twitter.png" alt="twitter icon">
                </a>
                <a href="https://instagram.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/instagram.png" alt="instagram icon">
                </a>
            </div>
        </footer>
    </div>
    <script>
        // get the feedback div element so we can do something with it.
        const feedbackElement = document.getElementById('feedback');
        // get the form so we can read what was entered in it.
        const formElement = document.forms[0];
        // add a 'listener' to wait for a submission of our form. When that happens run the code below.
        formElement.addEventListener('submit', function(e) {
            // stop the form from doing the default action.
            e.preventDefault();
            // set the contents of our feedback element to a message letting the user know the form was submitted successfully. Notice that we pull the name that was entered in the form to personalize the message!
            feedbackElement.innerHTML = 'Hello '+ formElement.user_name.value +'! Thank you for your message. We will get back with you as soon as possible!';
            // make the feedback element visible.
            feedbackElement.style.display = "block";
            // add a class to move everything down so our message doesn't cover it.
            document.body.classList.toggle('moveDown');
        });
    </script>
</body>
